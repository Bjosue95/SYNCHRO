<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#01305C">
  <link rel="icon" type="image/svg+xml" href="/branding/isotipo-claro.svg">
  <meta name="description" content="SYNCHRO: gestiona tus solicitudes de encomiendas y tus servicios desde una cuenta segura.">
  <title>SYNCHRO · Portal de usuarios</title>
  <script>
    (() => {
      try {
        const preferencia = localStorage.getItem("synchro-usuarios-tema");
        const oscuro = preferencia === "oscuro" || (!preferencia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = oscuro ? "oscuro" : "claro";
        document.documentElement.style.colorScheme = oscuro ? "dark" : "light";
      } catch { document.documentElement.dataset.theme = "claro"; }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
